<section id="teaching">
  <div class="interests-container">
    <header class="interests-header">
      <p class="eyebrow">Curiosity beyond the code</p>
      <h2>What Inspires Me</h2>
      <p class="tag-line">
        From exploring new technologies to enjoying music and good company, these are a few things
        that keep me curious, creative, and growing.
      </p>
    </header>
    <ul class="interest-list" aria-label="Interests and technologies">
      @for (interest of interests; track interest) {
        <li>{{ interest }}</li>
      }
    </ul>
  </div>
</section>
